<div class="team-list-container">
  <div class="header-actions">
    <h2>Team Management</h2>
    <button mat-raised-button color="primary">
      <mat-icon>add</mat-icon> Create Team
    </button>
  </div>

  <mat-form-field appearance="outline" class="full-width search-field">
    <mat-label>Search Teams</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Infrastructure" #input>
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="mat-elevation-z8 table-container">
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let row"> <strong>{{row.name}}</strong> </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let row"> {{row.description}} </td>
      </ng-container>

      <!-- MemberCount Column -->
      <ng-container matColumnDef="memberCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Members </th>
        <td mat-cell *matCellDef="let row"> {{row.memberCount}} </td>
      </ng-container>

      <!-- ManagerCount Column -->
      <ng-container matColumnDef="managerCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Managers </th>
        <td mat-cell *matCellDef="let row"> {{row.managerCount}} </td>
      </ng-container>

      <!-- ResponderCount Column -->
      <ng-container matColumnDef="responderCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Responders </th>
        <td mat-cell *matCellDef="let row"> {{row.responderCount}} </td>
      </ng-container>

      <!-- ActiveIncidentCount Column -->
      <ng-container matColumnDef="activeIncidentCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Active Incidents </th>
        <td mat-cell *matCellDef="let row"> 
          <span [class.text-warn]="row.activeIncidentCount > 0">{{row.activeIncidentCount}}</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" (click)="viewTeam(row.id)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteTeam(row.id)" [disabled]="row.activeIncidentCount > 0">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" colspan="7">No teams found.</td>
      </tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of teams"></mat-paginator>
  </div>
</div>
